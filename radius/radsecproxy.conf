# Bonus: radsecproxy recibe RADIUS normal (UDP 11812) y lo reenvía cifrado con TLS (TCP 2083)
ListenUDP 127.0.0.1:11812
LogLevel 3
LogDestination file:///tmp/zt-lab/radsecproxy.log

client local {
	host 127.0.0.1
	type udp
	secret testing123
}

tls lab {
	CACertificateFile /lab/pki/ca.pem
	CertificateFile /lab/pki/radsecproxy.pem
	CertificateKeyFile /lab/pki/radsecproxy.key
}

server radius-tls {
	host 127.0.0.1
	port 2083
	type tls
	tls lab
	secret radsec
	CertificateNameCheck off
}

realm * {
	server radius-tls
}
